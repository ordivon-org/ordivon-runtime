# Root-owned runtime truth.
d /var/lib/ordivon 0750 root root -
d /var/lib/ordivon/runtime 0700 root root -
d /var/lib/ordivon/registry 0700 root root -
d /var/lib/ordivon/control 0700 root root -
d /var/lib/ordivon/control/registry 0700 root root -
d /var/lib/ordivon/control/bundles 0700 root root -
d /var/lib/ordivon/control/results 0700 root root -

# Worker traversal roots. Core creates per-object children with explicit owners.
d /var/lib/ordivon/worker 0710 root ordivon-worker -
d /var/lib/ordivon/worker/workspaces 0710 root ordivon-worker -
d /var/lib/ordivon/worker/attempts 0710 root ordivon-worker -

# Payload-owned cache and bounded runtime state.
d /var/cache/ordivon-worker 0750 ordivon-worker ordivon-worker -
d /run/ordivon 0750 root ordivon-worker -
