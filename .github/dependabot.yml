version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - security/supply-chain

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - security/supply-chain
      - rust
