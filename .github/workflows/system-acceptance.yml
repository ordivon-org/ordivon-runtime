name: System acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * 0"

permissions:
  contents: read

jobs:
  systemd-cgroup-acceptance:
    runs-on: [self-hosted, linux, x64, ordivon-runtime-systemd]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Run real system acceptance
        env:
          ORDIVON_ACCEPTANCE_OUTPUT: target/acceptance/runtime-system-acceptance.json
        run: scripts/local-acceptance run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-system-acceptance-${{ github.sha }}
          path: target/acceptance/runtime-system-acceptance.json
          if-no-files-found: error
          retention-days: 30
