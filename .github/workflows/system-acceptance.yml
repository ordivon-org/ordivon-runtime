name: System acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * 0"

permissions:
  contents: read

jobs:
  systemd-cgroup-acceptance:
    runs-on: [self-hosted, linux, x64, ordivon-runtime-systemd]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Run real system acceptance
        env:
          ORDIVON_ACCEPTANCE_OUTPUT: target/acceptance/runtime-system-acceptance.json
        run: scripts/local-acceptance run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-system-acceptance-${{ github.sha }}
          path: target/acceptance/runtime-system-acceptance.json
          if-no-files-found: error
          retention-days: 30
