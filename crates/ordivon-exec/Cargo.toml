[package]
name = "ordivon-exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
supervisor-spike = ["dep:libc"]
universal-executor-m1 = ["dep:libc"]
transactional-registry-m6 = ["universal-executor-m1", "dep:rusqlite", "dep:uuid"]
runtime-hardening-m7 = ["transactional-registry-m6"]

[[bin]]
name = "ordivon-job-fixture"
path = "src/bin/ordivon-job-fixture.rs"
required-features = ["supervisor-spike"]

[[bin]]
name = "ordivon-task-runner"
path = "src/bin/ordivon-task-runner.rs"
required-features = ["universal-executor-m1"]

[[bin]]
name = "ordivon-m1-cli"
path = "src/bin/ordivon-m1-cli.rs"
required-features = ["universal-executor-m1"]

[dependencies]
hex.workspace = true
libc = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
uuid = { workspace = true, optional = true }

[[example]]
name = "m6_registry_performance"
path = "examples/m6_registry_performance.rs"
required-features = ["transactional-registry-m6"]
